<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Umme Shafiqa Clinic — Appointment Requests</title>
<link rel="icon" type="image/jpeg" href="logo.jpeg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

:root {
  --navy: #1B3A4B;
  --navy-light: #2C5468;
  --cream: #FAF6F0;
  --amber: #D9A24B;
  --rose: #C17767;
  --slate: #24313A;
  --slate-soft: #5B6B72;
  --line: #E4DDD0;
  --new: #C17767;
  --contacted: #D9A24B;
  --done: #6B8F71;
}

* { box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--cream);
  color: var(--slate);
  margin: 0;
  padding: 32px 24px 60px;
}

.admin-header {
  max-width: 1000px;
  margin: 0 auto 24px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.admin-header img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 2px solid var(--amber);
  object-fit: cover;
}

.admin-header h1 {
  font-family: 'Fraunces', serif;
  font-size: 1.5rem;
  color: var(--navy);
  margin: 0;
}

.admin-header .subtitle {
  font-size: 0.85rem;
  color: var(--slate-soft);
  margin: 2px 0 0;
}

.confirmation-code-tag {
  display: inline-block;
  margin-top: 3px;
  font-size: 0.75rem;
  font-family: 'Fraunces', serif;
  color: var(--slate-soft);
  letter-spacing: 0.5px;
}

.view-tabs {
  max-width: 1000px;
  margin: 0 auto 16px;
  display: flex;
  gap: 8px;
}

.view-tab-btn {
  padding: 9px 18px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--slate-soft);
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
}

.view-tab-btn.selected {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

#daily-schedule-container {
  max-width: 1000px;
  margin: 0 auto;
}

.schedule-slot-box {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 12px;
}

.schedule-slot-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Fraunces', serif;
  font-size: 1.1rem;
  color: var(--navy);
  border-bottom: 1px solid var(--line);
  padding-bottom: 8px;
  margin-bottom: 8px;
}

.schedule-slot-count {
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--slate-soft);
}

.schedule-slot-count.full {
  color: var(--rose);
}

.schedule-patient-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-size: 0.9rem;
}

.search-wrap {
  max-width: 1000px;
  margin: 0 auto 14px;
}

#search-box {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
}

#search-box:focus {
  outline: 2px solid var(--amber);
  outline-offset: 1px;
}

.table-wrap {
  max-width: 1000px;
  margin: 0 auto;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 2px 10px rgba(27,58,75,0.06);
}

table { width: 100%; border-collapse: collapse; }

th {
  background: var(--navy);
  color: var(--cream);
  text-align: left;
  padding: 14px 16px;
  font-size: 0.85rem;
  font-weight: 500;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

td {
  padding: 14px 16px;
  border-top: 1px solid var(--line);
  font-size: 0.94rem;
}

tr:hover td { background: #FDFBF8; }

tr.done td { opacity: 0.55; }

.status-pill {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  color: #fff;
  margin-right: 8px;
}

.view-payment-btn {
  margin-top: 4px;
  padding: 3px 8px;
  font-size: 0.75rem;
  border: 1px solid var(--amber);
  background: #FFFBF3;
  color: var(--navy);
  border-radius: 6px;
  cursor: pointer;
}

.cancel-btn {
  display: block;
  margin-top: 6px;
  padding: 4px 10px;
  font-size: 0.78rem;
  border: 1px solid #C17767;
  background: #FBEEEC;
  color: #A34A3A;
  border-radius: 6px;
  cursor: pointer;
}

.reassign-btn {
  display: block;
  margin-top: 4px;
  padding: 3px 8px;
  font-size: 0.75rem;
  border: 1px solid var(--line);
  background: var(--cream);
  color: var(--navy);
  border-radius: 6px;
  cursor: pointer;
}

.reassign-save-btn, .reassign-cancel-btn {
  margin-top: 6px;
  margin-right: 6px;
  padding: 4px 10px;
  font-size: 0.78rem;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid var(--line);
}

.reassign-save-btn {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

.reassign-cancel-btn {
  background: #fff;
  color: var(--slate);
}

[id^="appt-cell-"] select, [id^="appt-cell-"] input[type="date"] {
  margin-top: 4px;
  padding: 4px 6px;
  border-radius: 6px;
  border: 1px solid var(--line);
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
}

select {
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
  font-family: 'Inter', sans-serif;
  font-size: 0.88rem;
  background: var(--cream);
}

.empty-state {
  text-align: center;
  padding: 50px 20px;
  color: var(--slate-soft);
}
</style>
</head>
<body>

<div class="admin-header">
  <img src="logo.jpeg" alt="Clinic logo">
  <div>
    <h1>Appointment Requests</h1>
    <p class="subtitle">Umme Shafiqa Clinic — staff view</p>
  </div>
</div>

<div class="view-tabs">
  <button type="button" class="view-tab-btn selected" id="tab-all" onclick="switchView('all')">All Requests</button>
  <button type="button" class="view-tab-btn" id="tab-daily" onclick="switchView('daily')">Daily Schedule</button>
  <button type="button" class="view-tab-btn" id="tab-messages" onclick="switchView('messages')">Messages</button>
</div>

<div id="view-all">
  <div class="search-wrap">
    <input type="text" id="search-box" placeholder="Search by name or phone..." oninput="filterInquiries()">
  </div>

  <div class="table-wrap">
    <table id="data-table">
      <tr><th>Name</th><th>Phone</th><th>Type</th><th>Appointment</th><th>Received</th><th>Status</th></tr>
    </table>
  </div>
</div>

<div id="view-daily" style="display:none;">
  <div class="search-wrap">
    <input type="date" id="daily-date-picker">
  </div>
  <div id="daily-schedule-container"></div>
</div>

<div id="view-messages" style="display:none;">
  <div class="table-wrap">
    <table id="messages-table">
      <tr><th>Name</th><th>Contact</th><th>Message</th><th>Received</th><th>Status</th></tr>
    </table>
  </div>
</div>

<script>
const BACKEND = 'https://umme-shafiqa-backend-b8cwevgzcfgya3fe.austriaeast-01.azurewebsites.net';
const STATUS_COLORS = { New: '#C17767', Contacted: '#D9A24B', Done: '#6B8F71', 'Pending Payment Verification': '#B5697A', Cancelled: '#8A8A8A' };
let authHeader = null;

function getAuth() {
  if (!authHeader) {
    const user = prompt("Admin username:");
    const pass = prompt("Admin password:");
    authHeader = 'Basic ' + btoa(user + ':' + pass);
  }
  return authHeader;
}

let allInquiries = [];

function loadData() {
  fetch(BACKEND + '/inquiries', { headers: { 'Authorization': getAuth() } })
    .then(res => {
      if (res.status === 401) {
        authHeader = null;
        alert('Wrong username or password.');
        throw new Error('unauthorized');
      }
      return res.json();
    })
    .then(data => {
      data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      allInquiries = data;
      renderTable(data);
    })
    .catch(() => {});
}

function renderTable(data) {
  const table = document.getElementById('data-table');
  table.innerHTML = '<tr><th>Name</th><th>Phone</th><th>Type</th><th>Appointment</th><th>Received</th><th>Status</th></tr>';

  if (data.length === 0) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="6" class="empty-state">No matching appointment requests.</td>`;
    table.appendChild(tr);
    return;
  }

  data.forEach(row => {
    const tr = document.createElement('tr');
    if (row.status === 'Done') tr.classList.add('done');
    const date = new Date(row.created_at).toLocaleString();
    const color = STATUS_COLORS[row.status] || '#999';
    const isOnline = row.appointment_type === 'online';
    tr.innerHTML = `
      <td>${row.name}</td>
      <td>${row.phone}${row.confirmation_code ? `<br><span class="confirmation-code-tag">Code: ${row.confirmation_code}</span>` : ''}</td>
      <td>${isOnline ? '💻 Online' : '🏥 In-Person'}${isOnline ? `<br><button type="button" onclick="viewPayment(${row.id})" class="view-payment-btn">View Payment</button>` : ''}</td>
      <td id="appt-cell-${row.id}">
        <span id="appt-text-${row.id}">${row.appointment_date ? row.appointment_date + ' ' + formatTime12h(row.appointment_time) : '—'}</span>
        <button type="button" class="reassign-btn" onclick="startReassign(${row.id}, '${row.appointment_date || ''}')">Reassign</button>
      </td>
      <td>${date}</td>
      <td>
        <span class="status-pill" style="background:${color}">${row.status}</span>
        <select onchange="updateStatus(${row.id}, this.value)">
          <option value="Pending Payment Verification" ${row.status === 'Pending Payment Verification' ? 'selected' : ''}>Pending Payment</option>
          <option value="New" ${row.status === 'New' ? 'selected' : ''}>New</option>
          <option value="Contacted" ${row.status === 'Contacted' ? 'selected' : ''}>Contacted</option>
          <option value="Done" ${row.status === 'Done' ? 'selected' : ''}>Done</option>
          <option value="Cancelled" ${row.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
        </select>
        ${row.status !== 'Cancelled' ? `<button type="button" class="cancel-btn" onclick="cancelBooking(${row.id}, '${row.name.replace(/'/g, "\\'")}')">Cancel</button>` : ''}
      </td>`;
    table.appendChild(tr);
  });
}

function filterInquiries() {
  const query = document.getElementById('search-box').value.trim().toLowerCase();
  if (!query) {
    renderTable(allInquiries);
    return;
  }
  const filtered = allInquiries.filter(row =>
    row.name.toLowerCase().includes(query) ||
    row.phone.toLowerCase().includes(query) ||
    (row.confirmation_code && row.confirmation_code.toLowerCase().includes(query))
  );
  renderTable(filtered);
}

function formatTime12h(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const hour12 = ((h + 11) % 12) + 1;
  return `${hour12}:${m.toString().padStart(2, '0')} ${period}`;
}

function startReassign(id, currentDate) {
  const cell = document.getElementById(`appt-cell-${id}`);
  const todayStr = new Date().toLocaleDateString('en-CA');
  cell.innerHTML = `
    <input type="date" id="reassign-date-${id}" min="${todayStr}" value="${currentDate || todayStr}">
    <select id="reassign-slot-${id}"><option>Pick a date first</option></select>
    <br>
    <button type="button" onclick="saveReassign(${id})" class="reassign-save-btn">Save</button>
    <button type="button" onclick="loadData()" class="reassign-cancel-btn">Cancel</button>
  `;
  const dateInput = document.getElementById(`reassign-date-${id}`);
  dateInput.addEventListener('change', () => loadReassignSlots(id, dateInput.value));
  loadReassignSlots(id, dateInput.value);
}

function loadReassignSlots(id, forDate) {
  const select = document.getElementById(`reassign-slot-${id}`);
  select.innerHTML = '<option>Loading...</option>';
  fetch(`${BACKEND}/available-slots?for_date=${forDate}`)
    .then(res => res.json())
    .then(data => {
      if (!data.open) {
        select.innerHTML = '<option value="">Closed this day</option>';
        return;
      }
      select.innerHTML = '';
      data.slots.forEach(slot => {
        const opt = document.createElement('option');
        opt.value = slot.time;
        const label = formatTime12h(slot.time) + (slot.past ? ' — Past' : slot.full ? ' — Full' : ` — ${slot.remaining} left`);
        opt.textContent = label;
        if (slot.full || slot.past) opt.disabled = true;
        select.appendChild(opt);
      });
    })
    .catch(() => { select.innerHTML = '<option value="">Could not load slots</option>'; });
}

function saveReassign(id) {
  const newDate = document.getElementById(`reassign-date-${id}`).value;
  const newTime = document.getElementById(`reassign-slot-${id}`).value;
  if (!newDate || !newTime) {
    alert('Please pick both a date and an available time.');
    return;
  }
  fetch(`${BACKEND}/inquiries/${id}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json', 'Authorization': getAuth()},
    body: JSON.stringify({appointment_date: newDate, appointment_time: newTime})
  })
  .then(async res => {
    const result = await res.json();
    if (!res.ok) { alert(result.detail || 'Could not reassign this booking.'); return; }
    loadData();
  })
  .catch(() => alert('Something went wrong reassigning this booking.'));
}

function viewPayment(id) {
  fetch(`${BACKEND}/payment-screenshot/${id}`, { headers: { 'Authorization': getAuth() } })
    .then(res => {
      if (!res.ok) throw new Error('Could not load screenshot');
      return res.blob();
    })
    .then(blob => {
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    })
    .catch(() => alert('Could not load payment screenshot.'));
}

function cancelBooking(id, name) {
  if (!confirm(`Cancel ${name}'s appointment? This will free up their slot for someone else to book.`)) {
    return;
  }
  updateStatus(id, 'Cancelled');
}

function updateStatus(id, newStatus) {
  fetch(`${BACKEND}/inquiries/${id}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json', 'Authorization': getAuth()},
    body: JSON.stringify({status: newStatus})
  }).then(() => loadData());
}

// --- View tabs ---
const SCHEDULE_SLOT_TIMES = ["19:30", "20:00", "20:30", "21:00", "21:30"];
const SLOT_CAPACITY = 3;

function switchView(view) {
  document.getElementById('view-all').style.display = view === 'all' ? 'block' : 'none';
  document.getElementById('view-daily').style.display = view === 'daily' ? 'block' : 'none';
  document.getElementById('view-messages').style.display = view === 'messages' ? 'block' : 'none';
  document.querySelectorAll('.view-tab-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById(`tab-${view}`).classList.add('selected');

  if (view === 'daily') renderDailySchedule();
  if (view === 'messages') loadMessages();
}

// --- Daily Schedule ---
const dailyDatePicker = document.getElementById('daily-date-picker');
dailyDatePicker.value = new Date().toLocaleDateString('en-CA');
dailyDatePicker.addEventListener('change', renderDailySchedule);

function renderDailySchedule() {
  const container = document.getElementById('daily-schedule-container');
  const chosenDate = dailyDatePicker.value;
  if (!chosenDate) { container.innerHTML = ''; return; }

  const dayBookings = allInquiries.filter(row => row.appointment_date === chosenDate);

  container.innerHTML = '';
  SCHEDULE_SLOT_TIMES.forEach(slotTime => {
    const slotBookings = dayBookings.filter(row => row.appointment_time === slotTime && row.status !== 'Cancelled');
    const box = document.createElement('div');
    box.className = 'schedule-slot-box';
    const full = slotBookings.length >= SLOT_CAPACITY;
    box.innerHTML = `
      <div class="schedule-slot-header">
        <span>${formatTime12h(slotTime)}</span>
        <span class="schedule-slot-count ${full ? 'full' : ''}">${slotBookings.length} / ${SLOT_CAPACITY}</span>
      </div>
      ${slotBookings.length === 0
        ? '<p class="slot-hint">No bookings.</p>'
        : slotBookings.map(row => `
            <div class="schedule-patient-row">
              <span>${row.name} (${row.phone}) — ${row.appointment_type === 'online' ? '💻 Online' : '🏥 In-Person'}</span>
              <span class="status-pill" style="background:${STATUS_COLORS[row.status] || '#999'}">${row.status}</span>
            </div>
          `).join('')
      }
    `;
    container.appendChild(box);
  });
}

// --- Contact Messages ---
function loadMessages() {
  fetch(`${BACKEND}/contact-messages`, { headers: { 'Authorization': getAuth() } })
    .then(res => res.json())
    .then(data => {
      const table = document.getElementById('messages-table');
      table.innerHTML = '<tr><th>Name</th><th>Contact</th><th>Message</th><th>Received</th><th>Status</th></tr>';
      if (data.length === 0) {
        table.innerHTML += `<tr><td colspan="5" class="empty-state">No messages yet.</td></tr>`;
        return;
      }
      data.forEach(msg => {
        const tr = document.createElement('tr');
        const date = new Date(msg.created_at).toLocaleString();
        tr.innerHTML = `
          <td>${msg.name}</td>
          <td>${msg.contact_info}</td>
          <td>${msg.message}</td>
          <td>${date}</td>
          <td>
            <select onchange="updateMessageStatus(${msg.id}, this.value)">
              <option value="Unread" ${msg.read === 'Unread' ? 'selected' : ''}>Unread</option>
              <option value="Read" ${msg.read === 'Read' ? 'selected' : ''}>Read</option>
            </select>
          </td>`;
        table.appendChild(tr);
      });
    })
    .catch(() => {});
}

function updateMessageStatus(id, newStatus) {
  fetch(`${BACKEND}/contact-messages/${id}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json', 'Authorization': getAuth()},
    body: JSON.stringify({read: newStatus})
  }).then(() => loadMessages());
}

loadData();
</script>
</body>
</html>
